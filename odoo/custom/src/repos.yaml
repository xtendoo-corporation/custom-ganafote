# See https://github.com/Tecnativa/doodba#optodoocustomsrcreposyaml
./odoo:
  defaults:
    # Shallow repositories ($DEPTH_DEFAULT=1) are faster & thinner
    # You may need a bigger depth when merging PRs (use $DEPTH_MERGE
    # for a sane value of 100 commits)
    depth: $DEPTH_DEFAULT
  remotes:
    ocb: https://github.com/OCA/OCB.git
    odoo: https://github.com/odoo/odoo.git
    openupgrade: https://github.com/OCA/OpenUpgrade.git
  target: ocb $ODOO_VERSION
  merges:
    - ocb $ODOO_VERSION
    # Example of a merge of the PR with the number <PR>
    # - oca refs/pull/<PR>/head

# Repos OCA fijados a los commits exactos validados en la migración
# 16->19 (ver ~/migraciones/ganafote_16/NOTAS.md). No usar "última" del
# repo sin más: estos son los que pasaron OpenUpgrade y la validación.
account-financial-reporting:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/OCA/account-financial-reporting.git
  target: origin 19.0
  merges:
    - origin aa34bf33fc96fbae7fb5a2b9609b807b4e20514c
