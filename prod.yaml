services:
  odoo:
    extends:
      file: common.yaml
      service: odoo
    restart: unless-stopped
    env_file:
      - .docker/odoo.env
      - .docker/db-access.env
    environment:
      DB_FILTER: "^prod"
      DOODBA_ENVIRONMENT: "${DOODBA_ENVIRONMENT-prod}"
      INITIAL_LANG: "es_ES"
      LIST_DB: "false"
      ODOO_BUS_PUBLIC_SAMESITE_WS: 1
      PGHOST: ganafote-19-0-prod-db
    depends_on:
      - db
    networks:
      default:
      services_default:
    labels:
      doodba.domain.main: ""

  db:
    extends:
      file: common.yaml
      service: db
    environment:
      DB_HOST: ganafote-19-0-prod-db
    env_file:
      - .docker/db-creation.env
    restart: unless-stopped
    networks:
      default:
        aliases:
          - "ganafote-19-0-prod-db"
    ports:
      - "127.0.0.1:5432:5432"

  # Proxies de whitelist específicos de este cliente (AEAT/Verifactu, por los
  # módulos l10n_es_aeat_*). Van aquí (no en el odoo_services compartido del
  # servidor) para que el proyecto sea autocontenido y portable: si se
  # traslada a otro servidor, estos proxies se despliegan solos con él.
  # Los proxies genéricos (fonts.googleapis.com, stripe, geonames...) siguen
  # en el odoo_services compartido, vía la red services_default.
  proxy_verifactu_prewww1:
    restart: unless-stopped
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - prewww1.aeat.es
    environment:
      TARGET: prewww1.aeat.es
      PRE_RESOLVE: 1

  proxy_verifactu_prewww2:
    restart: unless-stopped
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - prewww2.aeat.es
    environment:
      TARGET: prewww2.aeat.es
      PRE_RESOLVE: 1

  proxy_verifactu_agencia:
    restart: unless-stopped
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - www2.agenciatributaria.gob.es
    environment:
      TARGET: www2.agenciatributaria.gob.es
      PRE_RESOLVE: 1

  proxy_verifactu_w3:
    restart: unless-stopped
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - www.w3.org
    environment:
      TARGET: www.w3.org
      PRE_RESOLVE: 1

networks:
  default:
    driver_opts:
      encrypted: 1
  services_default:
    external: true

volumes:
  filestore:
  db:
